<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 第二版开始支持手机。故意不写 user-scalable=no / maximum-scale：
       禁用双指缩放会让需要放大看小字的人用不了，无障碍上的代价不值当。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FEver 战队物资管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand-home" title="回到首页">
      <span class="brand-mark">FE</span>
      <span class="brand-text">FEver 战队物资管理</span>
    </div>
    <nav class="main-nav" id="main-nav"></nav>
  </header>

  <div class="crumb" id="crumb"></div>

  <main id="view-root" class="view-root"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="js/lib/qrcode.min.js"></script>
  <!-- 二维码**解码**库：手机浏览器（尤其 iOS）没有自带识别能力，靠它在本机解，不联网 -->
  <script src="js/db.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ops.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/modules/mechanical.js"></script>
  <script src="js/modules/electronic.js"></script>
  <script src="js/modules/vision.js"></script>
  <script src="js/modules/hardware.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/qr.js"></script>
  <!-- 二维码**解码**库：手机浏览器（尤其 iOS）没有自带识别能力，靠它在本机解，不联网 -->
  <script src="js/lib/jsQR.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/views.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/views-commerce.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
